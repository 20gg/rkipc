[audio.0]
enable = 1
card_name = hw:1,0
encode_type = G711A
format = S16
sample_rate = 16000
channels = 2
frame_size = 1152
bit_rate = 32000
input = mic_in
volume = 50

[video.source]
camera_id = 0       ; 如果是第二颗摄像头，启动时改成 1
width = 3840        ; IMX415 物理宽度
height = 2160       ; IMX415 物理高度
vi_chn_id = 0       ; 0 为 mainpath (全分辨率采集)
enable_vo = 0       ; 若无本地显示需求建议关闭，节省资源
vo_dev_id = 0
enable_jpeg = 1
enable_venc_0 = 1   ; 开启主码流
enable_venc_1 = 1   ; 开启子码流
enable_venc_2 = 0   ; 关闭第三码流（可选）

[video.0]
stream_type = mainStream
video_type = compositeStream
width = 3840
height = 2160
rc_mode = CBR       ; 固定码率，适合网络传输
rc_quality = highest
src_frame_rate_den = 1
src_frame_rate_num = 30
dst_frame_rate_den = 1
dst_frame_rate_num = 30
max_rate = 8192     ; 4K 码率建议 8192 (8Mbps)
min_rate = 0
output_data_type = H.265
smart = close
h264_profile = high
gop = 60            ; 关键帧间隔建议设置为帧率的 2 倍
smartp_viridrlen = 25
gop_mode = normalP
stream_smooth = 50

[video.1]
stream_type = subStream
video_type = compositeStream
width = 1280
height = 720
rc_mode = CBR
rc_quality = highest
src_frame_rate_den = 1
src_frame_rate_num = 30
dst_frame_rate_den = 1
dst_frame_rate_num = 30
max_rate = 2048
min_rate = 0
output_data_type = H.265
smart = close
h264_profile = high
gop = 60
smartp_viridrlen = 25
gop_mode = normalP
stream_smooth = 50

[isp.0.adjustment]
contrast    = 50
brightness  = 50
saturation  = 50
sharpness   = 50
fps         = 30
hue         = 50

[isp.0.exposure]
iris_type = auto
exposure_mode = auto
gain_mode = auto
auto_iris_level = 5
auto_exposure_enabled = 1
audo_gain_enabled = 1
exposure_time = 1/6
exposure_gain = 1

[isp.0.night_to_day]
night_to_day = day ; 强制白天模式，若有光敏电阻可设为 auto
night_to_day_filter_level = 5
night_to_day_filter_time = 5
ircut_filter_action = day

[isp.0.white_blance]
white_blance_style = autoWhiteBalance

[isp.0.enhancement]
noise_reduce_mode = auto
denoise_level = 50
spatial_denoise_level = 50
temporal_denoise_level = 50
dehaze = close
image_rotation = 0

[storage]
mount_path = /userdata
dev_path = /dev/mmcblk0p6
free_size_del_min = 500
free_size_del_max = 1000

[storage.0]
enable = 0 ; 默认关闭自动录像到本地

[system.device_info]
deivce_name = RK_IMX415_IPC
manufacturer = Rockchip

[osd.common]
is_presistent_text = 1
font_size = 64     ; 4K 下字体建议设大一点
font_path = /usr/share/SourceHanSansCN.ttf

[osd.0]
type = channelName
enabled = 1
position_x = 32
position_y = 32
display_text = IMX415_Cam0

[osd.1]
type = dateTime
enabled = 1
position_x = 32
position_y = 120
date_style = CHR-YYYY-MM-DD
time_style = 24hour
